[project]
name = "whisprnick"
version = "0.1.0"
description = "Local dictation app — faster-whisper + Ollama Qwen cleanup"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "faster-whisper>=1.1",
    "httpx>=0.28",
]

[project.scripts]
whisprnick = "whisprnick.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
